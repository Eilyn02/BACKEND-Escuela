name: CI Pipeline Dev

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: escuela_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d escuela_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/escuela_test

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar migraciones
        run: python migrate_db.py

      - name: Ejecutar seed
        run: python seed_db.py

      - name: Revisar estilo con Ruff
        run: ruff check .

      - name: Ejecutar prueba básica
        run: python -m pytest tests/test_app.py